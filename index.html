<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adivina la Canción 🎵 (Spotify Edition)</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            margin: 0;
        }
        h1 { color: #1DB954; font-size: 1.8rem; margin: 10px 0; text-align: center; }
        .card {
            background: #181818;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid #282828;
        }
        input {
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #333;
            background: #282828;
            color: white;
            width: 100%;
            font-size: 1rem;
            outline: none;
        }
        input:focus { border-color: #1DB954; }
        button {
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: none;
            width: 100%;
            background-color: #1DB954;
            color: white;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
        }
        button:active { transform: scale(0.98); }
        .btn-spotify { background-color: #1DB954; color: #000; font-size: 1.1rem; }
        .btn-secondary { background-color: #333; color: #eee; }
        .btn-pause { background-color: #ff9800; color: #000; }
        .btn-danger { background-color: #d32f2f; font-size: 0.85rem; padding: 10px; margin-top: 15px; }
        .scoreboard {
            display: flex;
            justify-content: space-around;
            background: #282828;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .score-num { font-size: 2.5rem; color: #1DB954; font-weight: bold; }
        .timer { font-size: 3rem; margin: 5px 0; color: #ffca28; font-weight: bold; font-family: monospace; }
        .song-info {
            background: #222;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
            font-weight: bold;
            color: #1DB954;
            min-height: 45px;
        }
        .player-select {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .badge-pts {
            background: #282828;
            color: #ffca28;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 5px;
            display: inline-block;
        }
        .error-log {
            color: #ff5252;
            font-size: 0.85rem;
            margin-top: 10px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <h1>🎵 Adivina la Canción</h1>

    <!-- PANTALLA 1: LOGIN -->
    <div class="card" id="login-card">
        <h2>Conectar con Spotify</h2>
        <p style="font-size: 0.9rem; color: #aaa;">Inicia sesión con tu cuenta de Spotify Premium para jugar.</p>
        <button class="btn-spotify" onclick="loginSpotify()">🟢 Iniciar Sesión con Spotify</button>
    </div>

    <!-- PANTALLA 2: CONFIGURACIÓN -->
    <div class="card" id="setup-card" style="display:none;">
        <h2>Configuración</h2>
        <input type="text" id="p1-name" placeholder="Nombre Jugador 1" value="Jugador 1">
        <input type="text" id="p2-name" placeholder="Nombre Jugador 2" value="Jugador 2">
        <input type="text" id="playlist-id" placeholder="Link o ID de Playlist de Spotify">
        <button id="btn-save-setup" onclick="saveSetup()">Guardar e Iniciar Juego</button>
        <div id="setup-error" class="error-log"></div>
        <button class="btn-secondary" onclick="logoutSpotify()" style="margin-top: 15px;">🔄 Reconectar / Resetear Token</button>
    </div>

    <!-- PANTALLA 3: JUEGO -->
    <div class="card" id="game-card" style="display:none;">
        <div class="scoreboard">
            <div>
                <div id="label-p1" style="color:#aaa;">P1</div>
                <div class="score-num" id="score-p1">0</div>
            </div>
            <div style="border-left: 1px solid #444;"></div>
            <div>
                <div id="label-p2" style="color:#aaa;">P2</div>
                <div class="score-num" id="score-p2">0</div>
            </div>
        </div>

        <div class="timer" id="timer-display">0.0s</div>
        <div class="badge-pts" id="current-pts-badge">Valor: 5 Puntos</div>

        <button id="btn-init-player" class="btn-spotify" onclick="manualInitPlayer()" style="display:none; background-color: #ffca28; color: #000; margin-bottom: 10px;">⚡ Activar Reproductor Web</button>

        <button id="btn-main-action" onclick="playRandomSong()" style="background-color: #1DB954; font-size: 1.1rem;">▶️ Siguiente Canción Aleatoria</button>
        <button id="btn-pause-manual" class="btn-pause" onclick="pauseManually()" style="display:none;">⏸️ Pausar Canción y Tiempo</button>

        <div style="margin-top: 15px;">
            <input type="text" id="guess-input" placeholder="Escribe el nombre de la canción...">
            <button class="btn-secondary" onclick="checkAnswer()">🔍 Comprobar Respuesta</button>
        </div>

        <div class="song-info" id="feedback-msg">Cargando reproductor...</div>

        <div id="assign-points-section" style="display:none; margin-top: 15px;">
            <p style="margin: 5px 0; font-size: 0.9rem;">¿Quién la adivinó?</p>
            <div class="player-select">
                <button onclick="awardPoints(1)" id="btn-award-p1">Jugador 1</button>
                <button onclick="awardPoints(2)" id="btn-award-p2">Jugador 2</button>
            </div>
        </div>

        <button class="btn-danger" onclick="logoutSpotify()">⚙️ Cerrar Sesión / Cambiar Playlist</button>
    </div>

    <script src="https://sdk.scdn.co/spotify-player.js"></script>
    <script>
        const CLIENT_ID = '03c5fd3099224cb9bfeea3acf10d5a55'; 
        const REDIRECT_URI = 'https://alexisparodi.github.io/adivina-la-cancion/';

        let accessToken = null;
        let spotifyPlayer = null;
        let deviceId = null;

        let p1Name = "Jugador 1", p2Name = "Jugador 2";
        let score1 = 0, score2 = 0;
        let playlistTracks = [];
        let currentTrack = null;

        let timerInterval = null;
        let startTime = 0;
        let elapsedTime = 0;
        let pendingPoints = 0;

        const checkPoints = [2.0, 5.0, 10.0];
        let nextCheckIndex = 0;

        function generateRandomString(length) {
            let text = '';
            let possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < length; i++) {
                text += possible.charAt(Math.floor(Math.random() * possible.length));
            }
            return text;
        }

        async function generateCodeChallenge(codeVerifier) {
            function base64encode(string) {
                return btoa(String.fromCharCode.apply(null, new Uint8Array(string)))
                    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            }
            const encoder = new TextEncoder();
            const data = encoder.encode(codeVerifier);
            const digest = await window.crypto.subtle.digest('SHA-256', data);
            return base64encode(digest);
        }

        window.onload = async function() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (code) {
                let codeVerifier = localStorage.getItem('code_verifier');
                let body = new URLSearchParams({
                    grant_type: 'authorization_code',
                    code: code,
                    redirect_uri: REDIRECT_URI,
                    client_id: CLIENT_ID,
                    code_verifier: codeVerifier
                });

                try {
                    const response = await fetch('https://accounts.spotify.com/api/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: body
                    });
                    const data = await response.json();
                    if (data.access_token) {
                        accessToken = data.access_token;
                        localStorage.setItem('spotify_token', accessToken);
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                } catch (e) {
                    console.error("Error obteniendo el token:", e);
                }
            } else {
                accessToken = localStorage.getItem('spotify_token');
            }

            if (accessToken) {
                document.getElementById('login-card').style.display = 'none';
                document.getElementById('setup-card').style.display = 'block';
                const savedP1 = localStorage.getItem('game_p1');
                const savedP2 = localStorage.getItem('game_p2');
                const savedPlaylist = localStorage.getItem('spotify_playlist_id');
                if (savedP1) document.getElementById('p1-name').value = savedP1;
                if (savedP2) document.getElementById('p2-name').value = savedP2;
                if (savedPlaylist) document.getElementById('playlist-id').value = savedPlaylist;
            }
        };

        async function loginSpotify() {
            let codeVerifier = generateRandomString(128);
            localStorage.setItem('code_verifier', codeVerifier);
            let codeChallenge = await generateCodeChallenge(codeVerifier);

            const scopes = [
                'streaming',
                'user-read-email',
                'user-read-private',
                'user-modify-playback-state',
                'user-read-playback-state',
                'playlist-read-private',
                'playlist-read-collaborative'
            ];

            const args = new URLSearchParams({
                response_type: 'code',
                client_id: CLIENT_ID,
                scope: scopes.join(' '),
                redirect_uri: REDIRECT_URI,
                code_challenge_method: 'S256',
                code_challenge: codeChallenge
            });

            window.location.href = 'https://accounts.spotify.com/authorize?' + args.toString();
        }

        function logoutSpotify() {
            localStorage.clear();
            window.location.href = REDIRECT_URI;
        }

        window.onSpotifyWebPlaybackSDKReady = () => {
            initSpotifyPlayer();
        };

        function initSpotifyPlayer() {
            if (!accessToken) return;

            if (spotifyPlayer) {
                spotifyPlayer.disconnect();
            }

            spotifyPlayer = new Spotify.Player({
                name: 'Adivina la Canción Web',
                getOAuthToken: cb => { cb(accessToken); },
                volume: 0.8
            });

            spotifyPlayer.addListener('ready', ({ device_id }) => {
                deviceId = device_id;
                document.getElementById('btn-init-player').style.display = 'none';
                const feedback = document.getElementById('feedback-msg');
                if (feedback) {
                    feedback.innerText = "🟢 Reproductor listo. Presiona 'Siguiente Canción'.";
                    feedback.style.color = "#1DB954";
                }
            });

            spotifyPlayer.addListener('not_ready', ({ device_id }) => {
                deviceId = null;
            });

            spotifyPlayer.addListener('authentication_error', () => {
                logoutSpotify();
            });

            spotifyPlayer.connect();
        }

        function manualInitPlayer() {
            initSpotifyPlayer();
            document.getElementById('feedback-msg').innerText = "⏳ Conectando reproductor...";
            document.getElementById('feedback-msg').style.color = "#ffca28";
        }

        function extractPlaylistId(input) {
            if (!input) return "";
            let str = input.trim();
            const match = str.match(/playlist\/([a-zA-Z0-9]{22})/) || str.match(/^([a-zA-Z0-9]{22})$/);
            return match ? match[1] : str.split('?')[0].split('/').pop();
        }

        async function saveSetup() {
            const errorDiv = document.getElementById('setup-error');
            errorDiv.innerText = "";
            
            const inputVal = document.getElementById('playlist-id').value.trim();
            const btnSave = document.getElementById('btn-save-setup');
            p1Name = document.getElementById('p1-name').value.trim() || "Jugador 1";
            p2Name = document.getElementById('p2-name').value.trim() || "Jugador 2";

            if (!inputVal) {
                errorDiv.innerText = "Ingresa un link de playlist válido.";
                return;
            }

            const playlistId = extractPlaylistId(inputVal);
            btnSave.innerText = "Buscando canciones...";
            btnSave.disabled = true;

            try {
                // Consulta directa al endpoint general de la playlist
                const res = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}`, {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });

                if (!res.ok) {
                    const errData = await res.json();
                    errorDiv.innerText = `Error Spotify (${res.status}): ${errData.error?.message || 'No se pudo acceder'}`;
                    
                    if (res.status === 401 || res.status === 403) {
                        errorDiv.innerText += " - Haz clic en '🔄 Reconectar / Resetear Token' abajo para actualizar tus permisos.";
                    }
                    btnSave.innerText = "Guardar e Iniciar Juego";
                    btnSave.disabled = false;
                    return;
                }

                const data = await res.json();
                
                if (data.tracks && data.tracks.items) {
                    playlistTracks = data.tracks.items
                        .map(item => item.track)
                        .filter(track => track && track.uri && track.name);
                }

                if (!playlistTracks || playlistTracks.length === 0) {
                    errorDiv.innerText = "La playlist está vacía o no contiene canciones públicas.";
                    btnSave.innerText = "Guardar e Iniciar Juego";
                    btnSave.disabled = false;
                    return;
                }

                localStorage.setItem('spotify_playlist_id', inputVal);
                localStorage.setItem('game_p1', p1Name);
                localStorage.setItem('game_p2', p2Name);

                btnSave.innerText = "Guardar e Iniciar Juego";
                btnSave.disabled = false;
                startGame();
            } catch (e) {
                console.error(e);
                errorDiv.innerText = "Error de conexión o de red.";
                btnSave.innerText = "Guardar e Iniciar Juego";
                btnSave.disabled = false;
            }
        }

        function startGame() {
            document.getElementById('label-p1').innerText = p1Name;
            document.getElementById('label-p2').innerText = p2Name;
            document.getElementById('btn-award-p1').innerText = "+ Puntos a " + p1Name;
            document.getElementById('btn-award-p2').innerText = "+ Puntos a " + p2Name;

            document.getElementById('setup-card').style.display = 'none';
            document.getElementById('game-card').style.display = 'block';

            if (!deviceId) {
                initSpotifyPlayer();
                document.getElementById('feedback-msg').innerText = "Conectando con el reproductor de Spotify...";
                document.getElementById('feedback-msg').style.color = "#ffca28";
                
                setTimeout(() => {
                    if (!deviceId) {
                        document.getElementById('btn-init-player').style.display = 'block';
                        document.getElementById('feedback-msg').innerText = "Presiona '⚡ Activar Reproductor Web' arriba para vincular Spotify.";
                    }
                }, 3000);
            }
        }

        async function playRandomSong() {
            if (!deviceId) {
                try {
                    const devRes = await fetch('https://api.spotify.com/v1/me/player/devices', {
                        headers: { 'Authorization': `Bearer ${accessToken}` }
                    });
                    const devData = await devRes.json();
                    if (devData.devices && devData.devices.length > 0) {
                        deviceId = devData.devices[0].id;
                    }
                } catch(e) {}

                if (!deviceId) {
                    document.getElementById('btn-init-player').style.display = 'block';
                    document.getElementById('feedback-msg').innerText = "Presiona '⚡ Activar Reproductor Web' para conectar la reproducción.";
                    document.getElementById('feedback-msg').style.color = "#ffca28";
                    return;
                }
            }

            document.getElementById('assign-points-section').style.display = 'none';
            document.getElementById('guess-input').value = '';
            document.getElementById('feedback-msg').innerText = "🔊 Sonando desde Spotify...";
            document.getElementById('feedback-msg').style.color = "#1DB954";

            nextCheckIndex = 0;
            updatePtsBadge(0);

            const randomIndex = Math.floor(Math.random() * playlistTracks.length);
            currentTrack = playlistTracks[randomIndex];

            await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
                method: 'PUT',
                body: JSON.stringify({ uris: [currentTrack.uri] }),
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${accessToken}`
                }
            });

            resetAndStartTimer();
            showPauseButton(true);
        }

        async function resumeSong() {
            if (spotifyPlayer) {
                await spotifyPlayer.resume();
            } else {
                await fetch('https://api.spotify.com/v1/me/player/play', {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
            }
            startTimerFromCurrent();
            showPauseButton(true);
            document.getElementById('feedback-msg').innerText = "🔊 Reanudando canción...";
            document.getElementById('feedback-msg').style.color = "#1DB954";
        }

        async function pauseManually() {
            await pausePlayback();
            document.getElementById('feedback-msg').innerText = "⏸️ Pausado. ¡Escribe tu respuesta!";
            document.getElementById('feedback-msg').style.color = "#ffca28";
            
            const btnMain = document.getElementById('btn-main-action');
            btnMain.innerText = "▶️ Continuar Canción";
            btnMain.onclick = resumeSong;
            btnMain.style.backgroundColor = "#ff9800";
        }

        async function pausePlayback() {
            if (spotifyPlayer) {
                await spotifyPlayer.pause();
            } else {
                await fetch('https://api.spotify.com/v1/me/player/pause', {
                    method: 'PUT',
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
            }
            stopTimer();
            showPauseButton(false);
        }

        function showPauseButton(visible) {
            const btnPause = document.getElementById('btn-pause-manual');
            const btnMain = document.getElementById('btn-main-action');
            if (visible) {
                btnPause.style.display = 'block';
                btnMain.style.display = 'none';
            } else {
                btnPause.style.display = 'none';
                btnMain.style.display = 'block';
            }
        }

        function resetAndStartTimer() {
            clearInterval(timerInterval);
            elapsedTime = 0;
            startTime = Date.now();
            runTimerLoop();
        }

        function startTimerFromCurrent() {
            clearInterval(timerInterval);
            startTime = Date.now() - elapsedTime;
            runTimerLoop();
        }

        function runTimerLoop() {
            timerInterval = setInterval(() => {
                elapsedTime = Date.now() - startTime;
                let seconds = elapsedTime / 1000;
                document.getElementById('timer-display').innerText = seconds.toFixed(1) + "s";
                updatePtsBadge(seconds);

                if (nextCheckIndex < checkPoints.length) {
                    let targetPoint = checkPoints[nextCheckIndex];
                    if (seconds >= targetPoint) {
                        pausePlayback();
                        nextCheckIndex++;
                        
                        document.getElementById('feedback-msg').innerHTML = `⏸️ <b>Pausa a los ${targetPoint}s</b><br>¿Alguien sabe la canción?`;
                        document.getElementById('feedback-msg').style.color = "#ffca28";

                        const btnMain = document.getElementById('btn-main-action');
                        btnMain.innerText = "▶️ Continuar (Siguiente tramo)";
                        btnMain.onclick = resumeSong;
                        btnMain.style.backgroundColor = "#ff9800";
                    }
                }
            }, 100);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function updatePtsBadge(seconds) {
            let pts = calculatePoints(seconds);
            document.getElementById('current-pts-badge').innerText = `Valor actual: ${pts} Punto(s)`;
        }

        function calculatePoints(seconds) {
            if (seconds <= 2.1) return 5;
            if (seconds <= 5.1) return 3;
            if (seconds <= 10.1) return 1;
            return 1;
        }

        function normalizeText(text) {
            return text.toLowerCase()
                       .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                       .replace(/[^a-z0-9]/g, "");
        }

        function checkAnswer() {
            const userGuess = document.getElementById('guess-input').value.trim();
            if (!userGuess || !currentTrack) return;

            const cleanGuess = normalizeText(userGuess);
            const cleanTitle = normalizeText(currentTrack.name);

            if (cleanTitle.includes(cleanGuess) && cleanGuess.length >= 3) {
                pausePlayback();

                let seconds = elapsedTime / 1000;
                pendingPoints = calculatePoints(seconds);

                document.getElementById('feedback-msg').innerHTML = `🎉 ¡CORRECTO! (${seconds.toFixed(1)}s)<br><small>${currentTrack.name} - ${currentTrack.artists[0].name}</small>`;
                document.getElementById('feedback-msg').style.color = "#1DB954";

                document.getElementById('assign-points-section').style.display = 'block';

                const btnMain = document.getElementById('btn-main-action');
                btnMain.innerText = "▶️ Siguiente Canción Aleatoria";
                btnMain.onclick = playRandomSong;
                btnMain.style.backgroundColor = "#1DB954";
            } else {
                document.getElementById('feedback-msg').innerText = "❌ Incorrecto, ¡sigue intentando!";
                document.getElementById('feedback-msg').style.color = "#d32f2f";
            }
        }

        function awardPoints(playerNum) {
            if (playerNum === 1) {
                score1 += pendingPoints;
                document.getElementById('score-p1').innerText = score1;
            } else {
                score2 += pendingPoints;
                document.getElementById('score-p2').innerText = score2;
            }

            document.getElementById('assign-points-section').style.display = 'none';
            document.getElementById('feedback-msg').innerText = `+${pendingPoints} pts agregados a ${playerNum === 1 ? p1Name : p2Name}. Toca "Siguiente Canción"`;
        }
    </script>
</body>
</html>
