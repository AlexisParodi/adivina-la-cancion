<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Adivina la Canción 🎵</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            margin: 0;
        }
        h1 { color: #1DB954; font-size: 1.8rem; margin: 10px 0; text-align: center; }
        .card {
            background: #181818;
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid #282828;
        }
        input {
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: 1px solid #333;
            background: #282828;
            color: white;
            width: 100%;
            font-size: 1rem;
            outline: none;
        }
        input:focus { border-color: #1DB954; }
        button {
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: none;
            width: 100%;
            background-color: #1DB954;
            color: white;
            font-weight: bold;
            font-size: 1.05rem;
            cursor: pointer;
        }
        button:active { transform: scale(0.98); }
        .btn-secondary { background-color: #333; color: #eee; }
        .btn-pause { background-color: #ff9800; color: #000; }
        .btn-danger { background-color: #d32f2f; font-size: 0.85rem; padding: 10px; margin-top: 15px; }
        .scoreboard {
            display: flex;
            justify-content: space-around;
            background: #282828;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .score-num { font-size: 2.5rem; color: #1DB954; font-weight: bold; }
        .timer { font-size: 3rem; margin: 5px 0; color: #ffca28; font-weight: bold; font-family: monospace; }
        
        #player-wrapper {
            margin: 10px auto;
            border-radius: 8px;
            overflow: hidden;
            width: 200px;
            height: 120px;
            background: #000;
        }
        
        .song-info {
            background: #222;
            padding: 12px;
            border-radius: 10px;
            margin-top: 10px;
            font-weight: bold;
            color: #1DB954;
            min-height: 45px;
        }
        .player-select {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .badge-pts {
            background: #282828;
            color: #ffca28;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.9rem;
            margin-bottom: 5px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1>🎵 Adivina la Canción</h1>

    <!-- CONFIGURACIÓN -->
    <div class="card" id="setup-card">
        <h2>Configuración</h2>
        <input type="text" id="p1-name" placeholder="Nombre Jugador 1" value="Jugador 1">
        <input type="text" id="p2-name" placeholder="Nombre Jugador 2" value="Jugador 2">
        <input type="text" id="playlist-id" placeholder="Link o ID de Playlist de YouTube">
        <button onclick="saveSetup()">Guardar e Iniciar Juego</button>
    </div>

    <!-- JUEGO PRINCIPAL -->
    <div class="card" id="game-card" style="display:none;">
        <div class="scoreboard">
            <div>
                <div id="label-p1" style="color:#aaa;">P1</div>
                <div class="score-num" id="score-p1">0</div>
            </div>
            <div style="border-left: 1px solid #444;"></div>
            <div>
                <div id="label-p2" style="color:#aaa;">P2</div>
                <div class="score-num" id="score-p2">0</div>
            </div>
        </div>

        <div class="timer" id="timer-display">0.0s</div>
        <div class="badge-pts" id="current-pts-badge">Valor: 5 Puntos</div>

        <div id="player-wrapper">
            <div id="yt-player"></div>
        </div>

        <!-- BOTONES DE CONTROL DE REPRODUCCIÓN Y PAUSA -->
        <button id="btn-main-action" onclick="playRandomSong()" style="background-color: #1DB954; font-size: 1.1rem;">▶️ Siguiente Canción Aleatoria</button>
        <button id="btn-pause-manual" class="btn-pause" onclick="pauseManually()" style="display:none;">⏸️ Pausar Canción y Tiempo</button>

        <div style="margin-top: 15px;">
            <input type="text" id="guess-input" placeholder="Escribe el nombre de la canción...">
            <button class="btn-secondary" onclick="checkAnswer()">🔍 Comprobar Respuesta</button>
        </div>

        <div class="song-info" id="feedback-msg">Presiona "Siguiente Canción" para comenzar</div>

        <div id="assign-points-section" style="display:none; margin-top: 15px;">
            <p style="margin: 5px 0; font-size: 0.9rem;">¿Quién la adivinó?</p>
            <div class="player-select">
                <button onclick="awardPoints(1)" id="btn-award-p1">Jugador 1</button>
                <button onclick="awardPoints(2)" id="btn-award-p2">Jugador 2</button>
            </div>
        </div>

        <button class="btn-danger" onclick="resetSetup()">⚙️ Cambiar Playlist o Nombres</button>
    </div>

    <script>
        let p1Name = "Jugador 1", p2Name = "Jugador 2";
        let score1 = 0, score2 = 0;
        let playlistId = "";
        let player = null;
        let timerInterval = null;
        let startTime = 0;
        let elapsedTime = 0;
        let isRunning = false;
        let currentSongTitle = "";
        let pendingPoints = 0;
        let isPlayerReady = false;

        // Tramos de pausas automáticas (en segundos)
        const checkPoints = [2.0, 5.0, 10.0];
        let nextCheckIndex = 0;

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {}

        window.onload = function() {
            const savedPlaylist = localStorage.getItem('yt_playlist_id');
            const savedP1 = localStorage.getItem('game_p1');
            const savedP2 = localStorage.getItem('game_p2');

            if (savedPlaylist) {
                document.getElementById('playlist-id').value = savedPlaylist;
                if (savedP1) document.getElementById('p1-name').value = savedP1;
                if (savedP2) document.getElementById('p2-name').value = savedP2;
                startGame();
            }
        };

        function extractPlaylistId(urlOrId) {
            if (urlOrId.includes("list=")) {
                return urlOrId.split("list=")[1].split("&")[0];
            }
            return urlOrId.trim();
        }

        function saveSetup() {
            const inputVal = document.getElementById('playlist-id').value.trim();
            p1Name = document.getElementById('p1-name').value.trim() || "Jugador 1";
            p2Name = document.getElementById('p2-name').value.trim() || "Jugador 2";

            if (!inputVal) {
                alert("Ingresa un link o ID de playlist de YouTube");
                return;
            }

            playlistId = extractPlaylistId(inputVal);

            localStorage.setItem('yt_playlist_id', playlistId);
            localStorage.setItem('game_p1', p1Name);
            localStorage.setItem('game_p2', p2Name);

            startGame();
        }

        function startGame() {
            p1Name = localStorage.getItem('game_p1') || "Jugador 1";
            p2Name = localStorage.getItem('game_p2') || "Jugador 2";
            playlistId = localStorage.getItem('yt_playlist_id');

            document.getElementById('label-p1').innerText = p1Name;
            document.getElementById('label-p2').innerText = p2Name;
            document.getElementById('btn-award-p1').innerText = "+ Puntos a " + p1Name;
            document.getElementById('btn-award-p2').innerText = "+ Puntos a " + p2Name;

            document.getElementById('setup-card').style.display = 'none';
            document.getElementById('game-card').style.display = 'block';

            player = new YT.Player('yt-player', {
                height: '120',
                width: '200',
                playerVars: {
                    'listType': 'playlist',
                    'list': playlistId,
                    'autoplay': 0,
                    'controls': 1,
                    'playsinline': 1
                },
                events: {
                    'onReady': () => { isPlayerReady = true; },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function updatePtsBadge(seconds) {
            let pts = calculatePoints(seconds);
            document.getElementById('current-pts-badge').innerText = `Valor actual: ${pts} Punto(s)`;
        }

        function playRandomSong() {
            if (!player || !isPlayerReady) {
                alert("El reproductor aún está cargando. Aguarda un segundo.");
                return;
            }

            document.getElementById('assign-points-section').style.display = 'none';
            document.getElementById('guess-input').value = '';
            document.getElementById('feedback-msg').innerText = "🔊 Reproduciendo canción...";
            document.getElementById('feedback-msg').style.color = "#1DB954";

            nextCheckIndex = 0;
            updatePtsBadge(0);

            try {
                const playlist = player.getPlaylist();
                if (playlist && playlist.length > 0) {
                    const randomIndex = Math.floor(Math.random() * playlist.length);
                    player.playVideoAt(randomIndex);
                } else {
                    player.playVideo();
                }
                
                resetAndStartTimer();
                showPauseButton(true);
            } catch (e) {
                console.error(e);
            }
        }

        function resumeSong() {
            if (player && player.playVideo) {
                player.playVideo();
                startTimerFromCurrent();
                showPauseButton(true);
                document.getElementById('feedback-msg').innerText = "🔊 Continuación de canción...";
                document.getElementById('feedback-msg').style.color = "#1DB954";
            }
        }

        function pauseManually() {
            pausePlayback();
            document.getElementById('feedback-msg').innerText = "⏸️ Pausado manualmente. ¡Ingresa tu respuesta!";
            document.getElementById('feedback-msg').style.color = "#ffca28";
            
            // Configura el botón principal para poder continuar si nadie adivina
            const btnMain = document.getElementById('btn-main-action');
            btnMain.innerText = "▶️ Continuar Canción";
            btnMain.onclick = resumeSong;
            btnMain.style.backgroundColor = "#ff9800";
        }

        function pausePlayback() {
            if (player && player.pauseVideo) player.pauseVideo();
            stopTimer();
            showPauseButton(false);
        }

        function showPauseButton(visible) {
            const btnPause = document.getElementById('btn-pause-manual');
            const btnMain = document.getElementById('btn-main-action');
            if (visible) {
                btnPause.style.display = 'block';
                btnMain.style.display = 'none';
            } else {
                btnPause.style.display = 'none';
                btnMain.style.display = 'block';
            }
        }

        function resetAndStartTimer() {
            clearInterval(timerInterval);
            elapsedTime = 0;
            startTime = Date.now();
            isRunning = true;
            runTimerLoop();
        }

        function startTimerFromCurrent() {
            clearInterval(timerInterval);
            startTime = Date.now() - elapsedTime;
            isRunning = true;
            runTimerLoop();
        }

        function runTimerLoop() {
            timerInterval = setInterval(() => {
                elapsedTime = Date.now() - startTime;
                let seconds = elapsedTime / 1000;
                document.getElementById('timer-display').innerText = seconds.toFixed(1) + "s";
                updatePtsBadge(seconds);

                // Comprobar freno automático por tramos
                if (nextCheckIndex < checkPoints.length) {
                    let targetPoint = checkPoints[nextCheckIndex];
                    if (seconds >= targetPoint) {
                        pausePlayback();
                        nextCheckIndex++;
                        
                        document.getElementById('feedback-msg').innerHTML = `⏸️ <b>Pausa a los ${targetPoint}s</b><br>¿Alguien sabe la canción?`;
                        document.getElementById('feedback-msg').style.color = "#ffca28";

                        // Cambiar botón principal a 'Continuar'
                        const btnMain = document.getElementById('btn-main-action');
                        btnMain.innerText = "▶️ Continuar (Siguiente tramo)";
                        btnMain.onclick = resumeSong;
                        btnMain.style.backgroundColor = "#ff9800";
                    }
                }
            }, 100);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            isRunning = false;
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                const videoData = player.getVideoData();
                if (videoData && videoData.title) {
                    currentSongTitle = videoData.title;
                }
            }
        }

        function calculatePoints(seconds) {
            if (seconds <= 2.1) return 5;
            if (seconds <= 5.1) return 3;
            if (seconds <= 10.1) return 1;
            return 1;
        }

        function normalizeText(text) {
            return text.toLowerCase()
                       .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                       .replace(/[^a-z0-9]/g, "");
        }

        function checkAnswer() {
            const userGuess = document.getElementById('guess-input').value.trim();
            if (!userGuess) return;

            if (!currentSongTitle && player && player.getVideoData) {
                currentSongTitle = player.getVideoData().title || "";
            }

            const cleanGuess = normalizeText(userGuess);
            const cleanTitle = normalizeText(currentSongTitle);

            if (cleanTitle.includes(cleanGuess) && cleanGuess.length >= 3) {
                pausePlayback();

                let seconds = elapsedTime / 1000;
                pendingPoints = calculatePoints(seconds);

                document.getElementById('feedback-msg').innerHTML = `🎉 ¡CORRECTO! (${seconds.toFixed(1)}s)<br><small>${currentSongTitle}</small>`;
                document.getElementById('feedback-msg').style.color = "#1DB954";

                document.getElementById('assign-points-section').style.display = 'block';

                // Restablecer botón para la siguiente ronda
                const btnMain = document.getElementById('btn-main-action');
                btnMain.innerText = "▶️ Siguiente Canción Aleatoria";
                btnMain.onclick = playRandomSong;
                btnMain.style.backgroundColor = "#1DB954";
            } else {
                document.getElementById('feedback-msg').innerText = "❌ Incorrecto, ¡sigue intentando!";
                document.getElementById('feedback-msg').style.color = "#d32f2f";
            }
        }

        function awardPoints(playerNum) {
            if (playerNum === 1) {
                score1 += pendingPoints;
                document.getElementById('score-p1').innerText = score1;
            } else {
                score2 += pendingPoints;
                document.getElementById('score-p2').innerText = score2;
            }

            document.getElementById('assign-points-section').style.display = 'none';
            document.getElementById('feedback-msg').innerText = `+${pendingPoints} pts agregados a ${playerNum === 1 ? p1Name : p2Name}. Toca "Siguiente Canción"`;
        }

        function resetSetup() {
            if (confirm("¿Quieres cambiar la playlist o reiniciar los puntos?")) {
                localStorage.clear();
                location.reload();
            }
        }
    </script>
</body>
</html>
